name: Pi compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PI_AUTOMATION_REF: a0fdc5780053237ac4ee24f49976ee5449e3aaab # v1.0.1

jobs:
  qualify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 24.15.0
          - os: macos-latest
            node: '24'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fitchmultz/.github
          ref: ${{ env.PI_AUTOMATION_REF }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: extension
          persist-credentials: false
      # Track main, but qualify only hosts at the supported Pi 1.0 floor.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: fork-source
        with:
          repository: fitchmultz/pi
          ref: main
          path: fork
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          package-manager-cache: false
      - name: Native search tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y fd-find ripgrep
          sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd
      - name: Native search tools (macOS)
        if: runner.os == 'macOS'
        run: |
          for tool in fd ripgrep; do
            brew list "$tool" >/dev/null 2>&1 || brew install "$tool"
          done
      - name: Check fork support floor
        id: fork-support
        env:
          FORK_REF: ${{ steps.fork-source.outputs.commit }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { appendFileSync, mkdirSync, readFileSync, writeFileSync } from "node:fs";
          const version = JSON.parse(readFileSync("fork/packages/coding-agent/package.json")).version;
          const match = /^(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?(?:\+[0-9A-Za-z.-]+)?$/.exec(version);
          assert.ok(match, `Invalid fork version: ${version}`);
          const supported = Number(match[1]) >= 1 && !version.startsWith("1.0.0-");
          appendFileSync(process.env.GITHUB_OUTPUT, `supported=${supported}\n`);
          if (!supported) {
            const receipt = { result: "unattempted", host: "fork", ref: process.env.FORK_REF, version, floor: "1.0.0", reason: "Fork is older than the supported Pi floor; no build or qualification attempted." };
            mkdirSync(`${process.env.RUNNER_TEMP}/fork-evidence`, { recursive: true });
            writeFileSync(`${process.env.RUNNER_TEMP}/fork-evidence/qualification.json`, JSON.stringify(receipt, null, 2) + "\n");
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Fork qualification: UNATTEMPTED\n\nFork \`${receipt.ref}\` is Pi ${version}, below the supported 1.0.0 floor. This is not a future-fork pass. Qualify again when the maintained fork reaches the floor.\n`);
            console.log(JSON.stringify(receipt));
          }
          NODE
      - name: Build fork main
        if: steps.fork-support.outputs.supported == 'true'
        id: fork
        working-directory: fork
        env:
          PI_OFFLINE: '1'
          PI_TELEMETRY: '0'
        run: |
          npm install --global "$(node -p 'require("../automation/package.json").packageManager')"
          ref=$(git rev-parse HEAD)
          echo "Fork ref: $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          npm ci --ignore-scripts
          npm run hydrate:model-data
          npm run build:offline
          node ../automation/scripts/pack-fork.mjs . "$RUNNER_TEMP/fork-package" "$ref"
          git diff --exit-code
      - name: Use the extension npm version
        run: npm install --global "$(node -p 'require("./extension/package.json").packageManager')"
      - name: Qualify official Pi
        run: |
          version=$(node -p 'require("./extension/package.json").devDependencies["@earendil-works/pi-coding-agent"]')
          node automation/scripts/qualify.mjs --repo pi-change-working-dir --source "$GITHUB_WORKSPACE/extension" \
            --host official --target "$version" --output "$RUNNER_TEMP/official-evidence"
      - name: Qualify fork Pi
        if: steps.fork-support.outputs.supported == 'true'
        env:
          PI_COMPAT_FORK_REF: ${{ steps.fork.outputs.ref }}
        run: |
          node automation/scripts/qualify.mjs --repo pi-change-working-dir --source "$GITHUB_WORKSPACE/extension" \
            --host fork --target "$RUNNER_TEMP/fork-package" --output "$RUNNER_TEMP/fork-evidence"

  compatibility:
    name: compatibility / compatibility
    if: always()
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every lane
        run: test "${{ needs.qualify.result }}" = success
