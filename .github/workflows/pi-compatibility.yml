name: Pi compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PI_AUTOMATION_REF: 9b08d65d70a01c74c4e01477ccf9473e86be33ee # main

jobs:
  resolve:
    uses: fitchmultz/.github/.github/workflows/resolve-hosts.yml@9b08d65d70a01c74c4e01477ccf9473e86be33ee # main
    with:
      automation-ref: 9b08d65d70a01c74c4e01477ccf9473e86be33ee # main

  qualify:
    needs: resolve
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 24.15.0
          - os: macos-latest
            node: '24'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fitchmultz/.github
          ref: ${{ env.PI_AUTOMATION_REF }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: extension
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fitchmultz/pi
          ref: ${{ needs.resolve.outputs.fork-ref }}
          path: fork
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          package-manager-cache: false
      - name: Native search tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y fd-find ripgrep
          sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd
      - name: Native search tools (macOS)
        if: runner.os == 'macOS'
        run: |
          for tool in fd ripgrep; do
            brew list "$tool" >/dev/null 2>&1 || brew install "$tool"
          done
      - name: Check fork support floor
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const version = JSON.parse(readFileSync("fork/packages/coding-agent/package.json")).version;
          const match = /^(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?(?:\+[0-9A-Za-z.-]+)?$/.exec(version);
          assert.ok(match, `Invalid fork version: ${version}`);
          assert.ok(Number(match[1]) >= 1 && !version.startsWith("1.0.0-"), `Fork ${version} is below the supported Pi 1.0.0 floor`);
          NODE
      - name: Build fork main
        working-directory: fork
        env:
          FORK_REF: ${{ needs.resolve.outputs.fork-ref }}
          PI_OFFLINE: '1'
          PI_TELEMETRY: '0'
        run: |
          npm install --global "$(node -p 'require("../automation/package.json").packageManager')"
          echo "Fork ref: $FORK_REF"
          npm ci --ignore-scripts
          npm run hydrate:model-data
          git diff --exit-code
          npm run build:offline
          node ../automation/scripts/pack-fork.mjs . "$RUNNER_TEMP/fork-package" "$FORK_REF"
          git diff --exit-code
      - name: Use the extension npm version
        run: npm install --global "$(node -p 'require("./extension/package.json").packageManager')"
      - name: Qualify official Pi
        env:
          OFFICIAL_VERSION: ${{ needs.resolve.outputs.official-version }}
        run: |
          node automation/scripts/qualify.mjs --repo pi-change-working-dir --source "$GITHUB_WORKSPACE/extension" \
            --host official --target "$OFFICIAL_VERSION" --output "$RUNNER_TEMP/official-evidence"
      - name: Qualify fork Pi
        env:
          PI_COMPAT_FORK_REF: ${{ needs.resolve.outputs.fork-ref }}
        run: |
          node automation/scripts/qualify.mjs --repo pi-change-working-dir --source "$GITHUB_WORKSPACE/extension" \
            --host fork --target "$RUNNER_TEMP/fork-package" --output "$RUNNER_TEMP/fork-evidence"
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: host-qualification-${{ matrix.os }}-${{ matrix.node }}
          path: |
            ${{ runner.temp }}/official-evidence
            ${{ runner.temp }}/fork-evidence
          if-no-files-found: error
          retention-days: 3

  compatibility:
    name: compatibility / compatibility
    if: always()
    needs: [resolve, qualify]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every lane
        env:
          RESOLVE: ${{ needs.resolve.result }}
          QUALIFY: ${{ needs.qualify.result }}
        run: test "$RESOLVE" = success && test "$QUALIFY" = success
