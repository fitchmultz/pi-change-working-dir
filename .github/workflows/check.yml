name: Pi host checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  linux:
    name: Linux / official and package
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - name: Native search tools
        run: |
          if ! command -v fd >/dev/null || ! command -v rg >/dev/null; then
            sudo rm -f /etc/apt/sources.list.d/google-chrome.sources
            sudo apt-get update
            sudo apt-get install -y fd-find ripgrep
            sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd
          fi
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Official Pi contract
        env:
          PI_OFFLINE: '1'
          PI_COMPAT_HOST: official
        run: npm run check:compat
      - name: Packed installation
        run: npm run test:install

  macos:
    name: macOS / official and fork
    runs-on: macos-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: extension
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fitchmultz/pi
          ref: main
          path: fork
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Native search tools
        run: |
          for tool in fd ripgrep; do
            brew list "$tool" >/dev/null 2>&1 || brew install "$tool"
          done
      - name: Official Pi contract
        working-directory: extension
        env:
          PI_OFFLINE: '1'
          PI_COMPAT_HOST: official
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check:compat
      - name: Build current fork
        working-directory: fork
        run: |
          printf 'Fork commit: '
          git rev-parse HEAD
          npm ci --ignore-scripts --no-audit --no-fund
          npm run hydrate:model-data
          PI_OFFLINE=1 PI_TELEMETRY=0 npm run build:offline
      - name: Fork runtime and checkpoint
        working-directory: extension
        env:
          PI_PACKAGE_DIR: ${{ github.workspace }}/fork/packages/coding-agent
          PI_COMPAT_HOST: fork
          PI_OFFLINE: '1'
        run: |
          npm test
          npm run test:bash
          npm run test:checkpoint

  compatibility:
    name: compatibility
    if: always()
    needs: [linux, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require both hosts
        env:
          LINUX: ${{ needs.linux.result }}
          MACOS: ${{ needs.macos.result }}
        run: test "$LINUX" = success && test "$MACOS" = success
