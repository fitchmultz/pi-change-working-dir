name: macOS Bash contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-paths:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: choco install fd ripgrep --yes --no-progress
      - name: Native Windows path comparisons
        env:
          PI_OFFLINE: '1'
        run: npm run test:paths
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Shared compatibility owns the Linux official/fork matrix.
        os: [macos-latest]
        node: ['22.19.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Native search tools
        run: |
          for tool in fd ripgrep; do
            brew list "$tool" >/dev/null 2>&1 || brew install "$tool"
          done
      - name: macOS selected local graph and Bash behavior
        env:
          PI_OFFLINE: '1'
          PI_COMPAT_HOST: official
        run: npm run check:compat
